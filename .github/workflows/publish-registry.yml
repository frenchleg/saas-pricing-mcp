name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# whenever it changes on main. Bump "version" in server.json to publish a new listing.
# Auth is GitHub OIDC: the registry trusts this repo for the io.github.frenchleg/* namespace,
# so no token or secret is needed.

on:
  push:
    branches: [main]
    paths: [server.json, .github/workflows/publish-registry.yml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already listed
        id: check
        run: |
          name=$(jq -r .name server.json); version=$(jq -r .version server.json)
          listed=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=${name#*/}" \
            | jq -r --arg n "$name" '.servers[]?.server | select(.name==$n) | .version')
          if echo "$listed" | grep -qx "$version"; then
            echo "$name $version is already in the registry; bump version in server.json to republish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.check.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
