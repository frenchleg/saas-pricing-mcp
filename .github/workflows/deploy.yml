name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the price-history step commit its log back to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node test/history.test.mjs
      - name: Record price changes in the history log
        # Compares data/products.json with the last snapshot. Commit messages containing
        # "correction" or "fix data" are logged as corrections, not real price changes.
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          KIND=change
          if echo "$COMMIT_MSG" | grep -qiE 'correction|fix data'; then KIND=correction; fi
          node scripts/record-history.mjs --kind "$KIND"
          if ! git diff --quiet -- data/price-history.json data/price-snapshot.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add data/price-history.json data/price-snapshot.json
            git commit -m "Record price changes [skip ci]"
            git push || echo "::warning::Could not push the history log (branch protection?). It is still deployed with this build."
          fi
      - run: npm run typecheck
      - name: Deploy to Cloudflare Workers
        # skipped until you add the CLOUDFLARE_API_TOKEN repo secret
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
